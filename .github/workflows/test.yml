name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ruby-full
          sudo gem install bashcov -N

      - name: Run tests
        run: ./test.sh

      - name: Publish coverage
        run: |
          COVERAGE=$(jq -r '.total.lines.percent | tonumber | (. * 100 | round) / 100' coverage/coverage.json)

          {
            echo "## Coverage"
            echo
            echo "**${COVERAGE}%**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
